[project]
name = "ipo-intelligence-agent"
version = "1.0.0"
description = "Autonomous multi-agent AI system for IPO investment intelligence"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi==0.111.1",
    "uvicorn[standard]==0.24.0",
    "langgraph==0.2.50",
    "langchain==0.3.12",
    "langchain-core==0.3.29",
    "langchain-openai==0.2.11",
    "langchain-anthropic==0.2.4",
    "langchain-google-genai==2.0.0",
    "sqlalchemy==2.0.36",
    "alembic==1.14.0",
    "asyncpg==0.29.0",
    "psycopg2-binary==2.9.10",
    "pgvector==0.2.5",
    "redis==5.2.0",
    "celery==5.4.0",
    "pydantic==2.9.2",
    "pydantic-settings==2.5.2",
    "pydantic-extra-types==2.10.0",
    "python-jose[cryptography]==3.3.0",
    "passlib[bcrypt]==1.7.4",
    "python-multipart==0.0.7",
    "httpx==0.27.0",
    "aiohttp==3.12.12",
    "beautifulsoup4==4.12.3",
    "lxml==5.2.2",
    "pandas==2.2.2",
    "numpy==1.26.4",
    "scipy==1.13.1",
    "scikit-learn==1.5.1",
    "ta-lib==0.4.28",
    "yfinance==0.2.46",
    "alpha-vantage==2.3.1",
    "sec-edgar-downloader==5.1.0",
    "openai==1.54.0",
    "anthropic==0.39.0",
    "google-generativeai==0.7.2",
    "llama-cpp-python==0.2.90",
    "sentence-transformers==3.1.1",
    "weaviate-client==4.8.1",
    "pinecone==5.0.1",
    "prometheus-client==0.20.0",
    "opentelemetry-api==1.26.0",
    "opentelemetry-sdk==1.26.0",
    "opentelemetry-exporter-otlp==1.26.0",
    "opentelemetry-instrumentation-fastapi==0.47b0",
    "opentelemetry-instrumentation-sqlalchemy==0.47b0",
    "opentelemetry-instrumentation-redis==0.47b0",
    "opentelemetry-instrumentation-celery==0.47b0",
    "structlog==24.1.0",
    "python-json-logger==2.0.7",
    "docker==7.1.0",
    "python-dotenv==1.0.1",
    "typer==0.25.1",
    "rich==13.9.4",
    "tenacity==8.3.0",
    "cachetools==5.5.0",
    "email-validator==2.2.0",
    "bcrypt==4.2.0",
    "itsdangerous==2.2.0",
    "jinja2==3.1.4",
    "markdown==3.6",
    "weasyprint==61.2",
    "reportlab==4.2.2",
]

[project.optional-dependencies]
dev = [
    "ruff==0.4.4",
    "mypy==1.11.1",
    "black==24.8.0",
    "isort==5.13.2",
    "pre-commit==3.8.0",
    "bandit==1.7.10",
    "safety==3.8.1",
    "pytest==8.3.3",
    "pytest-asyncio==0.23.7",
    "pytest-cov==5.0.0",
    "pytest-mock==3.14.0",
    "pytest-xdist==3.6.1",
    "pytest-timeout==2.3.1",
    "responses==0.25.3",
    "freezegun==1.5.1",
]
test = [
    "pytest==8.3.3",
    "pytest-asyncio==0.23.7",
    "pytest-cov==5.0.0",
    "pytest-mock==3.14.0",
    "pytest-xdist==3.6.1",
    "pytest-timeout==2.3.1",
    "responses==0.25.3",
    "freezegun==1.5.1",
]
docs = [
    "mkdocs==1.6.0",
    "mkdocs-material==9.5.21",
    "mkdocstrings[python]==1.0.6",
]
orchestration = [
]

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]
exclude = ["alembic*", "versions*", "tests*"]

[tool.ruff]
line-length = 100
target-version = "py312"
select = ["E", "F", "I", "UP", "W", "C4", "C90", "PTH", "T20", "TID"]
ignore = ["E501", "C901"]
fixable = ["ALL"]
unfixable = ["T20", "TID"]
exclude = [".git", "__pycache__", ".venv", "dist", "build", "*.egg-info", "migrations"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
indent-width = 4

[tool.mypy]
python_version = "3.12"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
disallow_untyped_decorators = true
no_implicit_optional = true
strict_optional = true
implicit_reexport = true
strict_concatenate = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_no_return = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --tb=short --strict-markers"

[tool.coverage.run]
source = ["app"]
omit = ["tests/*", "migrations/*"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise AssertionError",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
]

[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"